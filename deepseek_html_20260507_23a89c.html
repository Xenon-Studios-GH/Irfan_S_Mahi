<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irfan S Mahi ΓÇö Hero Section</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <style>
        /* Custom dotted background pattern */
        .hero-dot-bg {
            --dot-color: #4b4b55;          /* Ash color */
            --dot-size: 1.5px;
            --dot-spacing: 28px;
            background-image: radial-gradient(circle, var(--dot-color) var(--dot-size), transparent var(--dot-size));
            background-size: var(--dot-spacing) var(--dot-spacing);
            background-position: center;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Minimal glow waves */
        .glow-wave {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.06;
            z-index: 0;
            pointer-events: none;
        }
        
        /* Smooth float for image */
        .float-image {
            animation: none; /* GSAP will control */
            will-change: transform;
        }

        /* Extra minimal aesthetic */
        .hero-container {
            position: relative;
            overflow: hidden;
        }
        
        /* Image frame */
        .image-frame {
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.08);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .image-frame img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.05);
        }
    </style>
    <script>
        // Tailwind custom config for dark theme
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep': '#0a0a0a',
                        'card': '#111115',
                        'accent': '#8b5cf6',
                        'accent-soft': '#a855f7',
                        'muted': '#b0b0b8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-deep text-white antialiased">

    <!-- Hero Section with Tailwind + GSAP -->
    <section class="hero-container min-h-screen flex items-center relative py-20 px-4 md:px-8">
        
        <!-- Dotted Ash Background -->
        <div class="hero-dot-bg"></div>

        <!-- Animated Glow Waves (minimal) -->
        <div class="glow-wave" id="wave1" style="width: 500px; height: 500px; background: #8b5cf6; top: -10%; left: -5%;"></div>
        <div class="glow-wave" id="wave2" style="width: 350px; height: 350px; background: #a855f7; bottom: -8%; right: -4%;"></div>
        <div class="glow-wave" id="wave3" style="width: 280px; height: 280px; background: #7c3aed; top: 60%; left: 50%; transform: translate(-50%, -50%);"></div>

        <div class="max-w-6xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-10 items-center relative z-10">
            
            <!-- Left: Text & Stats -->
            <div class="space-y-5">
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-purple-500/20 bg-purple-500/5 text-accent-soft text-sm font-medium tracking-wide">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Actively Building
                </div>
                
                <h1 class="text-5xl md:text-6xl lg:text-7xl font-black tracking-tight leading-none">
                    IRFAN <span class="text-accent-soft">S</span> MAHI
                </h1>
                
                <p class="text-lg text-muted/80 font-medium tracking-wide">
                    Entrepreneur ΓÇó Founder ΓÇó Creative Strategist
                </p>
                
                <p class="text-base text-gray-400 max-w-md">
                    Ecosystem builder focused on media, branding, commerce, education & digital systems.
                </p>

                <!-- Stats -->
                <div class="flex flex-wrap gap-6 pt-2">
                    <div class="flex flex-col">
                        <span class="text-2xl font-bold" id="stat1">0+</span>
                        <span class="text-xs uppercase tracking-widest text-gray-500">Ventures</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-2xl font-bold" id="stat2">0+</span>
                        <span class="text-xs uppercase tracking-widest text-gray-500">Industries</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-2xl font-bold" id="stat3">0+</span>
                        <span class="text-xs uppercase tracking-widest text-gray-500">Projects</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-2xl font-bold" id="stat4">0%</span>
                        <span class="text-xs uppercase tracking-widest text-gray-500">Focus</span>
                    </div>
                </div>
            </div>

            <!-- Right: Founder Image with GSAP float animation -->
            <div class="flex justify-center md:justify-end">
                <div class="image-frame w-72 h-auto md:w-80 lg:w-96 shadow-2xl" id="founderImage">
                    <!-- Replace the placeholder with your actual image -->
                    <img 
                        src="https://placehold.co/600x700/1a1a1e/8b5cf6?text=Irfan+S+Mahi" 
                        alt="Irfan S Mahi" 
                        class="w-full h-full object-cover"
                        id="founderImg"
                    />
                </div>
            </div>
        </div>
    </section>

    <!-- GSAP Animations -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ΓöÇΓöÇ Gentle floating animation for the image ΓöÇΓöÇ
            gsap.to('#founderImage', {
                y: -12,
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
            });

            // ΓöÇΓöÇ Subtle movement for glow waves ΓöÇΓöÇ
            gsap.to('#wave1', {
                x: 30,
                y: -20,
                scale: 1.05,
                duration: 20,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
            });
            gsap.to('#wave2', {
                x: -25,
                y: 15,
                scale: 0.95,
                duration: 24,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
            });
            gsap.to('#wave3', {
                x: -15,
                y: -30,
                scale: 1.08,
                duration: 18,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
            });

            // ΓöÇΓöÇ Animated counters (simulate with GSAP) ΓöÇΓöÇ
            const animateCounter = (id, target, suffix) => {
                const el = document.getElementById(id);
                if (!el) return;
                const obj = { val: 0 };
                gsap.to(obj, {
                    val: target,
                    duration: 2,
                    ease: 'power3.out',
                    onUpdate: () => {
                        el.textContent = Math.floor(obj.val) + suffix;
                    },
                    scrollTrigger: {
                        trigger: el,
                        start: 'top 85%',
                    },
                });
            };

            // Register ScrollTrigger if available (standalone, but we can use simple load animation)
            // Since we're not loading ScrollTrigger, we'll just animate on load after a short delay.
            setTimeout(() => {
                const counters = [
                    { id: 'stat1', target: 4, suffix: '+' },
                    { id: 'stat2', target: 5, suffix: '+' },
                    { id: 'stat3', target: 25, suffix: '+' },
                    { id: 'stat4', target: 100, suffix: '%' },
                ];
                counters.forEach(c => {
                    const el = document.getElementById(c.id);
                    if (!el) return;
                    let current = 0;
                    const target = c.target;
                    const increment = target / 40;
                    const timer = setInterval(() => {
                        current += increment;
                        if (current >= target) {
                            current = target;
                            clearInterval(timer);
                        }
                        el.textContent = Math.floor(current) + c.suffix;
                    }, 40);
                });
            }, 300);
        });
    </script>

</body>
</html>
