<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#37353E',
                        secondary: '#44444E',
                        accent: '#715A5A',
                        light: '#D3DAD9',
                        dark: '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#1a1a1a] text-light font-sans antialiased">
    <nav class="dynamic-island fixed bottom-5 left-1/2 bg-black/90 backdrop-blur-xl z-50 border border-white/10 shadow-2xl px-6 py-3">
        <div class="island-content flex items-center justify-between gap-8">
            <div class="text-accent font-bold text-xl tracking-wider">MR</div>
            <ul class="island-menu flex gap-6 list-none">
                <li><a href="#hero" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">01</a></li>
                <li><a href="#work" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">02</a></li>
                <li><a href="#about" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">03</a></li>
                <li><a href="#contact" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">04</a></li>
            </ul>
        </div>
    </nav>

    <section id="hero" class="min-h-screen relative overflow-hidden">
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] rounded-full bg-accent clip-circle-bottom"></div>
    </section>

    <section id="work" class="min-h-screen flex flex-col items-center justify-center px-8 py-20">
        <div class="video-wrapper">
            <div class="video-glow"></div>
            <div class="video-frame">
                <video id="customVideo" class="video-element" preload="metadata">
                    <source src="assets/video/HeroSection_background_Video.mp4" type="video/mp4">
                </video>
                
                <div class="play-overlay" id="playOverlay">
                    <button class="big-play-btn" id="bigPlayBtn">
                        <div class="play-ring"></div>
                        <svg class="play-arrow" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>

                <div class="video-overlay" id="videoOverlay">
                    <div class="top-gradient"></div>
                    <div class="bottom-controls">
                        <div class="timeline-container">
                            <div class="timeline-buffer" id="timelineBuffer"></div>
                            <div class="timeline-progress" id="timelineProgress">
                                <div class="timeline-thumb"></div>
                            </div>
                            <div class="time-tooltip" id="timeTooltip"></div>
                        </div>
                        
                        <div class="controls-wrapper">
                            <div class="left-controls">
                                <button class="control-btn" id="playPauseBtn">
                                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    <svg class="icon-pause hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                </button>
                                
                                <button class="control-btn" id="rewindBtn">
                                    <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                                </button>
                                
                                <button class="control-btn" id="forwardBtn">
                                    <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                                </button>
                                
                                <div class="volume-wrapper">
                                    <button class="control-btn" id="volumeBtn">
                                        <svg class="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                                        <svg class="icon-muted hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                    </button>
                                    <div class="volume-slider-container">
                                        <input type="range" class="volume-track" id="volumeSlider" min="0" max="1" step="0.02" value="1">
                                    </div>
                                </div>
                                
                                <span class="time-display" id="currentTime">00:00</span>
                                <span class="time-separator">/</span>
                                <span class="time-display duration" id="totalTime">00:00</span>
                            </div>
                            
                            <div class="right-controls">
                                <button class="control-btn" id="settingsBtn">
                                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                                </button>
                                
                                <button class="control-btn pip-btn" id="pipBtn">
                                    <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
                                </button>
                                
                                <button class="control-btn" id="fullscreenBtn">
                                    <svg class="icon-fullscreen" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                    <svg class="icon-exit-fullscreen hidden" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
