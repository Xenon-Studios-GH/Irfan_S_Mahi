<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#37353E',
                        secondary: '#44444E',
                        accent: '#715A5A',
                        light: '#D3DAD9',
                        dark: '#1a1a1a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#1a1a1a] text-light font-sans antialiased">
    <nav class="dynamic-island fixed bottom-5 left-1/2 bg-black/90 backdrop-blur-xl z-50 border border-white/10 shadow-2xl px-6 py-3">
        <div class="island-content flex items-center justify-between gap-8">
            <div class="text-accent font-bold text-xl tracking-wider">MR</div>
            <ul class="island-menu flex gap-6 list-none">
                <li><a href="#hero" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">01</a></li>
                <li><a href="#work" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">02</a></li>
                <li><a href="#about" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">03</a></li>
                <li><a href="#contact" class="font-mono text-xs tracking-widest text-light/70 hover:text-accent transition-colors">04</a></li>
            </ul>
        </div>
    </nav>

    <section id="hero" class="min-h-screen relative overflow-hidden">
        <div class="absolute -bottom-[300px] left-1/2 -translate-x-1/2 w-[600px] h-[600px] rounded-full bg-accent clip-circle-bottom"></div>
    </section>

    <section id="work" class="min-h-screen flex flex-col items-center justify-center px-8 py-20">
        <h2 class="text-4xl font-bold text-light mb-4">Section Title</h2>
        <p class="text-light/60 text-lg mb-12">This is a subtitle for the section</p>
        <div class="video-wrapper">
            <div class="video-glow"></div>
            <div class="video-frame">
                <div class="plyr video-player" id="player">
                    <video id="customVideo" playsinline controls autoplay muted>
                        <source src="assets/video/HeroSection_background_Video.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
        <div class="mt-12 flex gap-4">
            <a href="#contact" class="px-8 py-4 bg-accent text-light rounded-lg font-semibold hover:bg-accent/80 transition-colors">Get in Touch</a>
            <a href="#projects" class="px-8 py-4 border border-light/30 text-light rounded-lg font-semibold hover:bg-light/10 transition-colors">View All Projects</a>
        </div>
    </section>

    <section id="about" class="min-h-screen flex items-center justify-center px-8">
        <h2 class="text-4xl font-bold text-light">Skills</h2>
    </section>

    <section id="contact" class="min-h-screen flex items-center justify-center px-8">
        <h2 class="text-4xl font-bold text-light">Contact</h2>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/video.js"></script>
</body>
</html>
