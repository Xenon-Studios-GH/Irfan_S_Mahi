<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munthasir Rahman | Co-Founder, Xenon Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo/mini_logo.png">
</head>

<body class="bg-[#030303] text-white">
    <!-- Dynamic Island Navbar -->
    <nav class="dynamic-island">
        <div class="island-content">
            <div class="island-logo">MR</div>
            <ul class="island-menu">
                <li><a href="#hero">01</a></li>
                <li><a href="#work">02</a></li>
                <li><a href="#about">03</a></li>
                <li><a href="#contact">04</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="relative min-h-screen flex items-center justify-center overflow-hidden">
        <!-- Video Background -->
        <video autoplay muted loop playsinline class="hero-video">
            <source src="assets/video/HeroSection_background_Video.mp4" type="video/mp4">
        </video>

        <!-- Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-[#030303] via-[#030303]/50 to-transparent"></div>

        <!-- Text Carousel -->
        <div class="carousel-container">
            <div class="carousel-track">
                <span>XENON STUDIOS</span>
                <span>CO-FOUNDER</span>
                <span>DHAKA</span>
                <span>DIGITAL EMPIRE</span>
                <span>XENON STUDIOS</span>
                <span>CO-FOUNDER</span>
                <span>DHAKA</span>
                <span>DIGITAL EMPIRE</span>
            </div>
        </div>

        <!-- Content -->
        <div class="relative z-10 px-6 flex flex-col items-center h-full">
            <!-- Profile Picture with Name -->
            <div class="hero-image">
                <img src="assets/img/heroSection_Profile_Photo.png" alt="Munthasir Rahman"
                    class="w-64 md:w-96 object-cover scale-[1.5]">
            </div>
        </div>
    </section>
</body>

</html>
