<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munthasir Rahman | Co-Founder, Xenon Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#030303] text-white">
    <!-- Hero Section -->
    <section class="min-h-screen flex">
        <!-- Sidebar Navigation -->
        <aside class="w-16 md:w-20 fixed left-0 top-0 h-full border-r border-white/5 flex flex-col items-center py-10 z-50">
            <div class="text-blue-500 font-bold text-xl mb-12">X</div>
            <nav class="flex-1 flex flex-col gap-8 text-xs font-mono text-gray-500">
                <a href="#hero" class="hover:text-white transition-colors">01</a>
                <a href="#work" class="hover:text-white transition-colors">02</a>
                <a href="#about" class="hover:text-white transition-colors">03</a>
                <a href="#contact" class="hover:text-white transition-colors">04</a>
            </nav>
            <div class="text-xs font-mono text-gray-500 -rotate-90 whitespace-nowrap">SCROLL ↓</div>
        </aside>

        <!-- Main Content -->
        <main class="ml-16 md:ml-20 w-full">
            <!-- Hero -->
            <section id="hero" class="min-h-screen flex items-center justify-center relative overflow-hidden">
                <!-- Background Effect -->
                <div class="absolute inset-0 bg-gradient-to-br from-blue-900/10 via-transparent to-transparent"></div>
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(46,91,255,0.15),transparent_50%)] animate-pulse"></div>
                
                <!-- Content -->
                <div class="relative z-10 px-6 md:px-20">
                    <p class="text-blue-500 font-mono text-sm tracking-[0.3em] mb-6">CO-FOUNDER @ XENON STUDIOS</p>
                    <h1 class="text-6xl md:text-9xl font-bold tracking-tight leading-none">
                        MUNTHASIR<br>
                        <span class="text-gray-600">RAHMAN</span>
                    </h1>
                    <p class="text-gray-400 mt-8 max-w-md text-lg">
                        Building digital empires. Architect of next-gen web experiences.
                    </p>
                    <div class="mt-12 flex items-center gap-4">
                        <div class="w-12 h-[1px] bg-blue-500"></div>
                        <span class="text-sm font-mono text-gray-500">DHAKA → LONDON → GLOBAL</span>
                    </div>
                </div>
            </section>
        </main>
    </section>

    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
