<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#37353E',
                        secondary: '#44444E',
                        accent: '#715A5A',
                        light: '#D3DAD9',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-light text-primary font-sans">
    <section class="min-h-screen flex items-center justify-between px-32 py-16 relative overflow-hidden">
        <div class="max-w-2xl z-10">
            <h1 class="text-7xl font-bold mb-4 tracking-tight text-primary">Mahi</h1>
            <p class="text-2xl text-secondary mb-10">Creative Developer & Designer</p>
            <div class="flex gap-4">
                <a href="#projects" class="bg-primary text-light px-8 py-4 rounded-lg font-semibold hover:-translate-y-1 hover:shadow-lg transition-all duration-300">View Work</a>
                <a href="#contact" class="bg-transparent text-primary border-2 border-primary px-8 py-4 rounded-lg font-semibold hover:-translate-y-1 transition-all duration-300">Contact</a>
            </div>
        </div>
        <div class="relative w-[500px] h-[500px]">
            <div class="absolute w-[400px] h-[400px] rounded-full bg-primary top-12 right-0"></div>
            <div class="absolute w-64 h-64 rounded-full bg-accent top-0 right-40"></div>
            <div class="absolute w-40 h-40 rounded-full bg-secondary bottom-12 left-12"></div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
